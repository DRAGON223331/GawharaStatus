name: GawharaStatus
version: 1.0.1
main: net.gawhara.status.StatusPlugin
api-version: '26.1'
author: GawharaSMP
description: عرض حالة الخادم العلنية في ديسكورد (يعمل / جارٍ إعادة التشغيل / متوقف مع عدد اللاعبين)
commands:
  serverstatus:
    description: تحديث حالة الخادم أو إعادة تحميل الإعدادات
    usage: /serverstatus [refresh|reload|reset]
    aliases: [gstatus]
    permission: gawharastatus.admin
permissions:
  gawharastatus.admin:
    description: التحكم في إضافة الحالة
    default: op
