# ===== GawharaStatus =====
# ترسل الإضافة رسالة واحدة في قناة ديسكورد ثم تعدّلها بنفسها (دون إنشاء رسائل جديدة).
# الحالات: 🟢 يعمل | 🟠 جارٍ إعادة التشغيل | 🔴 متوقف
#
# القاعدة: إذا أُغلق الخادم بأمر إيقاف عادي (stop) تظهر الحالة «متوقف»،
# وعند تشغيله من جديد تتحول الحالة تلقائيًا إلى «يعمل».
# أما «جارٍ إعادة التشغيل» فلا تظهر إلا عند تنفيذ الأمر restart.

discord:
  # رابط Webhook للقناة العلنية: إعدادات القناة > التكاملات > Webhooks > Webhook جديد > نسخ الرابط
  webhook-url: ""
  username: "حالة خادم GawharaSMP"
  avatar-url: ""

server-name: "GawharaSMP"
java-ip: "gawhara.play.hosting"
bedrock-ip: "gawhara.play.hosting"
bedrock-port: 44019

# عدد الثواني بين كل تحديث للرسالة (الحد الأدنى 15). ويُجرى تحديث فوري أيضًا عند دخول لاعب أو خروجه.
update-interval-seconds: 60

# ===== المعلومات الظاهرة في الرسالة (القيم: true أو false) =====
show-ping: true      # متوسط زمن استجابة اللاعبين (وأقله وأعلاه)
show-tps: true       # معدل التحديث في الثانية
show-mspt: true      # زمن الدورة الواحدة بالمللي ثانية
show-ram: true       # استهلاك الذاكرة
show-uptime: true    # مدة تشغيل الخادم
show-version: true   # إصدار الخادم
# عرض أسماء المتواجدين داخل الخادم
show-player-names: false

# (لم يعد له تأثير) أصبح الإيقاف العادي يُعرض دائمًا «متوقف».
treat-stop-as-restart: false

# شكل الرسالة (اترك الحقل فارغًا إن لم تكن بحاجة إليه)
embed:
  author: "{server}"
  thumbnail-url: ""   # رابط صورة أو شعار الخادم (صورة صغيرة في أعلى الجهة)
  image-url: ""       # رابط لافتة عريضة أسفل الرسالة

texts:
  title-online: "🟢 {server} — يعمل"
  title-restarting: "🟠 {server} — جارٍ إعادة التشغيل"
  title-offline: "🔴 {server} — متوقف"
  desc-online: "الخادم يعمل ويمكنك الدخول الآن ✅"
  desc-restarting: "الخادم قيد إعادة التشغيل، انتظر دقيقة ثم عُد 🔄"
  desc-offline: "الخادم متوقف حاليًا ❌"
  status-online: "✅ يعمل"
  status-restarting: "🔄 جارٍ إعادة التشغيل"
  status-offline: "❌ متوقف"
  f-status: "الحالة"
  f-players: "👥 اللاعبون"
  f-updated: "🕒 آخر تحديث"
  f-java: "☕ Java"
  f-bedrock: "📱 Bedrock"
  f-ping: "📶 متوسط زمن الاستجابة"
  f-ram: "🧠 الذاكرة"
  f-uptime: "⏳ مدة التشغيل"
  f-version: "🧩 الإصدار"
  f-names: "🎮 المتواجدون في الخادم"
  footer: "إذا مرّ على آخر تحديث أكثر من دقيقتين فالخادم متوقف"
